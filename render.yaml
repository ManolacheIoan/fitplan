# Render Blueprint for the backend (free plan, Frankfurt / EU).
services:
  - type: web
    name: fitplan-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Free instances have no pre-deploy step: migrations and the (idempotent) seed run at start.
    # --no-access-log: request lines are not written to the logs.
    startCommand: >-
      alembic upgrade head && python -m seed &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.2"
      - key: DATABASE_URL
        sync: false # Neon connection string (EU region)
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false # e.g. https://fitplan.netlify.app
      # Client IP for rate limiting = right-most X-Forwarded-For entry (added by Render).
      # Never trust uvicorn's --forwarded-allow-ips='*'. See DECISIONS.md.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: COOKIE_SECURE
        value: "true"
      - key: FOOD_SOURCE
        value: open_food_facts
      - key: OFF_USER_AGENT
        sync: false # e.g. "FitPlan/1.0 (your-contact@example.com)"
      - key: MAINTENANCE_TOKEN
        generateValue: true # copy it into the GitHub secret FITPLAN_MAINTENANCE_TOKEN
      - key: FEATURE_AI_MEAL_PARSING
        value: "false"
