# Netlify site settings: base directory = frontend. Set in the Netlify UI (scope: Builds):
#   BACKEND_URL   e.g. https://fitplan-api.onrender.com
#   PROXY_SECRET  same value as PROXY_SECRET on Render (see DECISIONS.md)
# scripts/configure-proxy.mjs replaces the placeholders in the [[redirects]] rule below.
[build]
  command = "node scripts/configure-proxy.mjs && npm run build"
  publish = "out"

# Same-origin API: Netlify proxies /api/* to Render, adding the shared secret header so
# the backend trusts Netlify's visitor IP header (X-Nf-Client-Connection-Ip).
[[redirects]]
  from = "/api/*"
  to = "BACKEND_URL_PLACEHOLDER/api/:splat"
  status = 200
  force = true
  [redirects.headers]
    X-FitPlan-Proxy-Secret = "PROXY_SECRET_PLACEHOLDER"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
